name: CI

# Cross-platform build / vet / test. No serial hardware on CI runners, so the
# port-facing paths are not exercised; this covers the GOOS-conditional files
# in go.bug.st/serial and the pure-function regression tests.

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
